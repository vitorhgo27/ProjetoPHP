name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Verificar sintaxe PHP
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Executar testes automatizados
        run: |
          for teste in tests/*_test.php; do
            [ -f "$teste" ] || continue
            php "$teste" || exit 1
          done